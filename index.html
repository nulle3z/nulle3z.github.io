<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME - nulle3z</title>
    <script src="./include/marked.min.js"></script>
    <link rel="stylesheet" href="./include/common.css">
    <link rel="stylesheet" href="./include/github-markdown-dark.css">
    <link rel="icon" type="image/jpeg" href="./images/title.jpeg">
  </head>
  <body>
    <div class="wall">
      <nav class="brick" style="margin-top: 0.8%">
        <ul>
          <li><a href="album.html">ALBUM</a></li>
          <li><a href="blog.html">BLOG</a></li>
        </ul>
      </nav>
      
      <div class="brick">
        <div id="markdown-container">
          <p>Loading content...</p>
        </div>
      </div>

      <footer class="brick" style="padding: 2px 0; text-align: center">
      </footer>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('markdown-container');
        
        try {
          const response = await fetch('README.md'); 
          
          if (!response.ok) {
            throw new Error(`Failed to load file: ${response.status}`);
          }

          const markdownText = await response.text();

          const html = marked.parse(markdownText, {
          });

          container.innerHTML = html;
          
        } catch (error) {
          console.error('Error loading Markdown:', error);
          container.innerHTML = `<p style="color: #ff8888;">Error loading content: ${error.message}</p>`;
        }
      });
    </script>
  </body>
</html>
